name: Build iOS IPA

on:
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
      - '.github/workflows/build-ipa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned Release .app (arm64 iOS)
        working-directory: ios
        run: |
          xcodebuild \
            -project NEETQuest.xcodeproj \
            -scheme NEETQuest \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify www/index.html is bundled inside .app
        working-directory: ios
        run: |
          APP_DIR="build/Build/Products/Release-iphoneos/NEETQuest.app"
          ls -la "$APP_DIR"
          test -f "$APP_DIR/www/index.html" || (echo "ERROR: www/index.html missing from .app!" && exit 1)
          test -f "$APP_DIR/www/assets/rank_emblem.jpg" || (echo "ERROR: www/assets missing!" && exit 1)
          echo "VERIFIED: www/index.html and assets are inside NEETQuest.app!"

      - name: Package NEETQuest.ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NEETQuest.app Payload/
          zip -qry NEETQuest.ipa Payload
          ls -lh NEETQuest.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEETQuest-IPA
          path: ios/NEETQuest.ipa

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          name: NEET Quest iOS IPA (v1.0.4)
          body: |
            Unsigned iOS `.ipa` for **NEET Quest** (`v1.0.4`, verified `www/index.html` bundled).
          files: ios/NEETQuest.ipa
